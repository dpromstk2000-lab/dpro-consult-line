          DPRO_GUIDE_B64

      - name: Validate embedded R3 engine
        shell: bash
        run: |
          set -euo pipefail
          test -f product-ready-demo/tutorial-v1.1.js
          test -f product-ready-demo/tutorial-v1.1.css
          test -f /tmp/dpro-consult-r3r4/consult-tutorial-r3-r4-qa.mjs
          test -f /tmp/dpro-consult-r3r4/guide-center.html
          grep -Fq 'CONSULT-TUTORIAL-STANDARD-V1.1-20260830' product-ready-demo/tutorial-v1.1.js
          test "$(grep -o "id:'CONSULT-T[0-9][0-9]'" product-ready-demo/tutorial-v1.1.js | sort -u | wc -l | tr -d ' ')" = "10"
          ! grep -Eq '/api/admin/demo/prepare|fetch\(|XMLHttpRequest|\.submit\(' product-ready-demo/tutorial-v1.1.js

      - name: Implement R3 on accepted safe-demo pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = [
              'product-ready-demo/index.html',
              'product-ready-demo/member.html',
              'product-ready-demo/staff.html',
              'product-ready-demo/owner.html',
              'product-ready-demo/owner-ipad.html',
              'product-ready-demo/demo-guide.html',
          ]
          css = '<link rel="stylesheet" href="./tutorial-v1.1.css?v=CONSULT-TUTORIAL-STANDARD-V1.1-20260830">'
          js = '<script src="./tutorial-v1.1.js?v=CONSULT-TUTORIAL-STANDARD-V1.1-20260830"></script>'
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if css not in text:
                  if '</head>' not in text:
                      raise SystemExit(f'missing </head>: {name}')
                  text = text.replace('</head>', css + '\n</head>', 1)
              if js not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'missing </body>: {name}')
                  text = text.replace('</body>', js + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          PY
          grep -RFl 'tutorial-v1.1.js?v=CONSULT-TUTORIAL-STANDARD-V1.1-20260830' product-ready-demo/{index,member,staff,owner,owner-ipad,demo-guide}.html | wc -l | grep -qx '6'

      - name: Commit R3 implementation
        id: r3commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'dpro-tutorial-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add product-ready-demo/tutorial-v1.1.js product-ready-demo/tutorial-v1.1.css \
                  product-ready-demo/index.html product-ready-demo/member.html product-ready-demo/staff.html \
                  product-ready-demo/owner.html product-ready-demo/owner-ipad.html product-ready-demo/demo-guide.html
          if ! git diff --cached --quiet; then
            git commit -m 'Implement CONSULT Tutorial R3 STANDARD V1.1'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages build after R3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for R3 public LIVE
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            token="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$i"
            js_ok=0
            html_ok=0
            curl -fsSL -H 'Cache-Control: no-cache' "${PUBLIC_BASE}tutorial-v1.1.js?qa=$token" | grep -Fq 'CONSULT-TUTORIAL-STANDARD-V1.1-20260830' && js_ok=1 || true
            curl -fsSL -H 'Cache-Control: no-cache' "${PUBLIC_BASE}index.html?qa=$token" | grep -Fq 'tutorial-v1.1.js?v=CONSULT-TUTORIAL-STANDARD-V1.1-20260830' && html_ok=1 || true
            if [ "$js_ok" = 1 ] && [ "$html_ok" = 1 ]; then
              echo 'R3 LIVE READY'
              exit 0
            fi
            sleep 10
          done
          echo 'R3 public LIVE did not reach expected version' >&2
          exit 1

      - name: R3 exact four-width LIVE QA
        shell: bash
        env:
          EVIDENCE_PATH: /tmp/r3-live.json
          SOURCE_COMMIT: ${{ steps.r3commit.outputs.sha }}
        run: |
          set -euo pipefail
          node /tmp/dpro-consult-r3r4/consult-tutorial-r3-r4-qa.mjs r3
          cat /tmp/r3-live.json

      - name: Implement R4 Guide Center only after R3 PASS
        id: r4commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tutorial-evidence/batch10-consult
          cp /tmp/r3-live.json tutorial-evidence/batch10-consult/r3-live.json
          cp /tmp/dpro-consult-r3r4/guide-center.html product-ready-demo/guide-center.html
          test "$(grep -c 'class="guide-card"' product-ready-demo/guide-center.html)" = "10"
          git add tutorial-evidence/batch10-consult/r3-live.json product-ready-demo/guide-center.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add CONSULT Tutorial R4 Guide Center after R3 PASS'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages build after R4
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" || true

      - name: Wait for R4 public LIVE
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            token="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-r4-$i"
            if curl -fsSL -H 'Cache-Control: no-cache' "${PUBLIC_BASE}guide-center.html?qa=$token" | grep -Fq 'DPRO TUTORIAL / GUIDE CENTER / STANDARD V1.1'; then
              echo 'R4 LIVE READY'
              exit 0
            fi
            sleep 10
          done
          echo 'R4 public LIVE did not reach expected version' >&2
          exit 1

      - name: R4 exact four-width LIVE QA
        shell: bash
        env:
          EVIDENCE_PATH: /tmp/r4-live.json
          SOURCE_COMMIT: ${{ steps.r4commit.outputs.sha }}
        run: |
          set -euo pipefail
          node /tmp/dpro-consult-r3r4/consult-tutorial-r3-r4-qa.mjs r4
          cat /tmp/r4-live.json

      - name: Record R4 QA evidence
        id: final
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/r4-live.json tutorial-evidence/batch10-consult/r4-live.json
          cat > tutorial-evidence/batch10-consult/STATUS.txt <<'TXT'
          SYSTEM=CONSULT
          BATCH=10
          STANDARD=V1.1
          R2_CENTRAL=ACCEPTED
          R3=PASS
          R4=PASS
          FIRST10_COUNT=10
          GUIDE_COUNT=10
          BUSINESS_MUTATION=0
          FORWARD_ONLY=PASS
          R5=NOT_STARTED_NOT_AUTHORIZED
          R6=NOT_STARTED_NOT_AUTHORIZED
          R7=NOT_AUTHORIZED_NOT_EXECUTED
          TXT
          git add tutorial-evidence/batch10-consult/r4-live.json tutorial-evidence/batch10-consult/STATUS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record CONSULT Tutorial R4 LIVE QA PASS'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Upload QA evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: consult-tutorial-r3-r4-live-qa
          path: |
            /tmp/r3-live.json
            /tmp/r4-live.json
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          {
            echo '## CONSULT Tutorial Batch-10 R3-R4'
            echo ''
            echo '- R2 CENTRAL: ACCEPTED'
            echo '- R3: PASS'
            echo '- R4: PASS'
            echo '- First10: 10'
            echo '- Guide Center: 10'
            echo '- Business mutation: 0'
            echo '- R5/R6/R7: NOT STARTED / NOT AUTHORIZED'
            echo "- Final main: ${{ steps.final.outputs.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
