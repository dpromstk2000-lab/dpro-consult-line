name: CONSULT Tutorial R3-R4 STANDARD V1.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/consult-tutorial-r3-r4.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: consult-tutorial-r3-r4
  cancel-in-progress: false

jobs:
  r3-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUBLIC_BASE: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record forward-only source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})"

      - name: Materialize embedded R3-R4 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-demo /tmp/dpro-consult-r3r4 .dpro

