name: DPRO SHAROUSHI Product Ready R3 Pages Deploy Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V7.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dpro-sharoushi-pages-final
  cancel-in-progress: false

jobs:
  pages-deploy-final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify formal R2 source and static Safe Demo
        shell: bash
        run: |
          set -euo pipefail

          test -f product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          grep -F 'DPRO-CONTROL-ADAPTER-1.0-SHAROUSHI-20260823-R2V2' \
            product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts

          test -f product-ready-demo/index.html
          test -f product-ready-demo/member.html
          test -f product-ready-demo/owner.html
          test -f product-ready-demo/staff.html
          test -f product-ready-demo/owner-ipad.html
          test -f product-ready-demo/system-check.html
          test -f product-ready-demo/config.js
          test -f product-ready-demo/SAFE_DEMO_VERSION.txt

          grep -F 'SHAROUSHI-PR3-STATIC-SAFE-DEMO-20260823' \
            product-ready-demo/SAFE_DEMO_VERSION.txt

          grep -F 'dpro-sharoushi-control-gateway-v2' \
            product-ready-demo/config.js

          echo "FORMAL_SOURCE_AND_STATIC_DEMO=PASS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'product-ready/' \
            --exclude 'product-ready-evidence/' \
            --exclude '*.zip'

          touch _site/.nojekyll

          test -f _site/index.html
          test -f _site/product-ready-demo/index.html
          test -f _site/product-ready-demo/config.js

          echo "PAGES_ARTIFACT=PASS"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed static Safe Demo
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo'
          EXPECT='SHAROUSHI-PR3-STATIC-SAFE-DEMO-20260823'
          ok=0

          for i in $(seq 1 24); do
            status="$(curl -sS -o /tmp/sharoushi-static.html -w '%{http_code}' \
              "${BASE}/index.html?v7=${GITHUB_RUN_ID}-${i}" || true)"

            version_text="$(curl -fsSL \
              "${BASE}/SAFE_DEMO_VERSION.txt?v7=${GITHUB_RUN_ID}-${i}" || true)"

            if [ "$status" = "200" ] && echo "$version_text" | grep -Fq "$EXPECT"; then
              ok=1
              echo "PUBLIC_STATIC_SAFE_DEMO=PASS attempt=$i"
              break
            fi

            echo "Waiting after explicit Pages deploy: attempt=$i status=$status"
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            echo "Explicit Pages deployment completed but expected Safe Demo is not public."
            exit 1
          fi

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharoushi-v7
          cd /tmp/sharoushi-v7
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run final Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/sharoushi-r3-final/screenshots

          cat > /tmp/sharoushi-v7/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE =
            'https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/';

          const cases = [
            { key:'pc-owner',         file:'owner.html',        width:1440, height:1000 },
            { key:'mobile390',        file:'index.html',        width:390,  height:844  },
            { key:'mobile320-member', file:'member.html',       width:320,  height:720  },
            { key:'ipad-owner',       file:'owner-ipad.html',   width:1024, height:768  },
            { key:'pc-staff',         file:'staff.html',        width:1440, height:1000 },
            { key:'system-check',     file:'system-check.html', width:1440, height:1000 }
          ];

          const blockingConsolePattern =
            /(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;

          const technicalPattern =
            /(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser = await chromium.launch({ headless:true });
          const results = [];
          let failed = false;

          for (const c of cases) {
            const context = await browser.newContext({
              viewport: { width:c.width, height:c.height },
              deviceScaleFactor: 1
            });

            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const httpErrors = [];

            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('response', r => {
              if (r.status() >= 400) {
                httpErrors.push({
                  status:r.status(),
                  url:r.url(),
                  resourceType:r.request().resourceType()
                });
              }
            });

            let status = 0;
            let navigationError = '';

            try {
              const resp = await page.goto(
                BASE + c.file + '?qa=' + Date.now(),
                { waitUntil:'domcontentloaded', timeout:60000 }
              );
              status = resp?.status() || 0;
              await page.waitForTimeout(3000);
            } catch (e) {
              navigationError = String(e);
            }

            const metrics = navigationError ? null : await page.evaluate(() => {
              const de = document.documentElement;
              const b = document.body;

              return {
                innerWidth:window.innerWidth,
                documentScrollWidth:de?.scrollWidth || 0,
                bodyScrollWidth:b?.scrollWidth || 0,
                overflow:
                  Math.max(de?.scrollWidth || 0, b?.scrollWidth || 0) >
                  window.innerWidth + 1,
                text:(b?.innerText || '').slice(0,250000)
              };
            });

            const blockingConsoleErrors =
              consoleErrors.filter(x => blockingConsolePattern.test(x));

            const criticalResourceErrors = httpErrors.filter(x =>
              x.resourceType === 'document' ||
              x.resourceType === 'script' ||
              x.resourceType === 'stylesheet'
            );

            const technicalExposure =
              metrics ? technicalPattern.test(metrics.text) : true;

            const record = {
              ...c,
              url:BASE + c.file,
              httpStatus:status,
              navigationError,
              overflow:metrics?.overflow ?? true,
              innerWidth:metrics?.innerWidth ?? 0,
              documentScrollWidth:metrics?.documentScrollWidth ?? 0,
              bodyScrollWidth:metrics?.bodyScrollWidth ?? 0,
              pageErrors,
              consoleErrors,
              blockingConsoleErrors,
              httpErrors,
              criticalResourceErrors,
              technicalExposure
            };

            record.ok =
              !navigationError &&
              status === 200 &&
              !record.overflow &&
              pageErrors.length === 0 &&
              blockingConsoleErrors.length === 0 &&
              criticalResourceErrors.length === 0 &&
              !technicalExposure;

            if (!record.ok) failed = true;
            results.push(record);

            if (!navigationError) {
              await page.screenshot({
                path:`product-ready-evidence/sharoushi-r3-final/screenshots/${c.key}.png`,
                fullPage:true
              });
            }

            await context.close();
          }

          await browser.close();

          const summary = {
            ok:!failed,
            checkedAt:new Date().toISOString(),
            publicSafeDemoBase:BASE,
            safeDemoVersion:'SHAROUSHI-PR3-STATIC-SAFE-DEMO-20260823',
            formalR2SourceCommit:'7c024207744f09b6f954a4d54f304dda4fecf2ce',
            total:results.length,
            passed:results.filter(x => x.ok).length,
            failed:results.filter(x => !x.ok).length,
            results
          };

          fs.writeFileSync(
            'product-ready-evidence/sharoushi-r3-final/browser-final.json',
            JSON.stringify(summary,null,2) + '\n'
          );

          console.log(JSON.stringify({
            ok:summary.ok,
            total:summary.total,
            passed:summary.passed,
            failed:summary.failed,
            failedCases:results.filter(x => !x.ok)
          }, null, 2));

          process.exit(summary.ok ? 0 : 2);
          EOF

          cd "$GITHUB_WORKSPACE"

          set +e
          node /tmp/sharoushi-v7/qa.mjs
          rc=$?
          set -e

          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Commit final browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d product-ready-evidence/sharoushi-r3-final ]; then
            echo "No browser evidence directory exists; Chromium did not run."
            exit 1
          fi

          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-evidence/sharoushi-r3-final

          if git diff --cached --quiet; then
            echo "No final browser evidence changes."
          else
            git commit -m "Publish SHAROUSHI final Pages browser evidence V7"
          fi

          git pull --rebase
          git push

      - name: PASS cleanup
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail

          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V7.yml
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V6.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V5.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V4.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3.yml 2>/dev/null || true
          git rm -f ".github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3 (1).yml" 2>/dev/null || true

          git commit -m "Complete SHAROUSHI Product Ready R3 Pages browser gate"
          git push

      - name: FAIL preserve final evidence
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "Final Chromium gate has a blocking failure."
          echo "Evidence path:"
          echo "product-ready-evidence/sharoushi-r3-final/browser-final.json"
          exit 1
