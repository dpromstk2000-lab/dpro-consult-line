name: CONSULT Tutorial R6 Public LIVE QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consult-tutorial-r6-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consult-tutorial-r6-live-qa
  cancel-in-progress: false

env:
  PRODUCT_REPO: dpromstk2000-lab/dpro-line-systems-site
  PRODUCT_PREWRITE_HEAD: 05dc125591767190d8f4e59fedbfed22a28131ee
  PRODUCT_R6_COMMIT: 1000f970d811db824610bf3185475bfa6e6737d5
  PRODUCT_URL: https://dpromstk2000-lab.github.io/dpro-line-systems-site/systems/sharoushi.html
  TUTORIAL_URL: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/index.html?purpose=consultation#tutorial=1
  GUIDE_URL: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/guide-center.html
  QUICK_PDF_URL: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/manuals/DPRO_TUTORIAL_CONSULT_QUICK_START_V1.0.pdf
  DETAIL_PDF_URL: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/manuals/DPRO_TUTORIAL_CONSULT_DETAILED_MANUAL_V1.0.pdf
  TUTORIAL_JS_URL: https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/tutorial-v1.1.js

jobs:
  public-live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CONSULT QA source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consult-r6-qa"
          cd "$RUNNER_TEMP/consult-r6-qa"
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Run exact R6 public LIVE QA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          cat > "$RUNNER_TEMP/consult-r6-qa/r6-live-qa.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const env = process.env;
          const evidence = {
            system: 'CONSULT',
            batch: 10,
            stage: 'R6',
            productSite: {},
            links: {},
            browser: {},
            first10Count: null,
            guideCount: null,
            unsafeWriteRequestCount: 0,
            businessMutation: 0,
            productSiteRegression: 0,
            productSiteRollback: 0,
            r7: 'NOT_AUTHORIZED_NOT_EXECUTED',
            finalLock: 'CENTRAL_DECISION_ONLY',
            overallPass: false
          };

          function assert(cond, msg) {
            if (!cond) throw new Error(msg);
          }
          const sha256 = b => crypto.createHash('sha256').update(b).digest('hex');
          const apiHeaders = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Authorization': `Bearer ${env.GH_TOKEN}`,
            'User-Agent': 'DPRO-CONSULT-R6-QA'
          };
          async function getBuffer(url, extraHeaders={}) {
            const r = await fetch(url, {
              redirect: 'follow',
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache', ...extraHeaders }
            });
            const b = Buffer.from(await r.arrayBuffer());
            return {status:r.status, ok:r.ok, headers:Object.fromEntries(r.headers.entries()), body:b, finalUrl:r.url};
          }
          async function getJson(url) {
            const r = await fetch(url, {headers:apiHeaders, cache:'no-store'});
            assert(r.ok, `GitHub API ${r.status}: ${url}`);
            return await r.json();
          }

          // ----- Product Site forward-only / exact scope evidence -----
          const branch = await getJson(`https://api.github.com/repos/${env.PRODUCT_REPO}/branches/main`);
          const latest = branch.commit.sha;
          evidence.productSite.prewriteHead = env.PRODUCT_PREWRITE_HEAD;
          evidence.productSite.r6Commit = env.PRODUCT_R6_COMMIT;
          evidence.productSite.latestMainHead = latest;
          evidence.productSite.latestMainTree = branch.commit.commit.tree.sha;

          const preToR6 = await getJson(
            `https://api.github.com/repos/${env.PRODUCT_REPO}/compare/${env.PRODUCT_PREWRITE_HEAD}...${env.PRODUCT_R6_COMMIT}`
          );
          assert(['ahead','identical'].includes(preToR6.status), `R6 commit is not forward from prewrite: ${preToR6.status}`);
          const changed = preToR6.files.map(f => f.filename).sort();
          const expectedChanged = ['systems/sharoushi.html','systems/sharoushi.html.txt'].sort();
          assert(JSON.stringify(changed) === JSON.stringify(expectedChanged),
            `R6 target scope mismatch: ${JSON.stringify(changed)}`);
          evidence.productSite.r6ChangedFiles = changed;

          const r6ToLatest = await getJson(
            `https://api.github.com/repos/${env.PRODUCT_REPO}/compare/${env.PRODUCT_R6_COMMIT}...${latest}`
          );
          assert(['ahead','identical'].includes(r6ToLatest.status),
            `Latest main is not forward from R6 commit: ${r6ToLatest.status}`);
          evidence.productSite.forwardOnly = 'PASS';

          const rawBase = `https://raw.githubusercontent.com/${env.PRODUCT_REPO}/${latest}/systems`;
          const htmlRaw = await getBuffer(`${rawBase}/sharoushi.html`);
          const txtRaw = await getBuffer(`${rawBase}/sharoushi.html.txt`);
          assert(htmlRaw.ok && txtRaw.ok, `Current mirror fetch failed: HTML=${htmlRaw.status} TXT=${txtRaw.status}`);
          assert(htmlRaw.body.equals(txtRaw.body), 'Current sharoushi HTML/TXT are not byte-identical');
          evidence.productSite.htmlSha256 = sha256(htmlRaw.body);
          evidence.productSite.txtSha256 = sha256(txtRaw.body);
          evidence.productSite.htmlTextByteIdentical = true;

          const source = htmlRaw.body.toString('utf8');
          const requiredSourceTokens = [
            'data-consult-tutorial-resource="tutorial-start"',
            'data-consult-tutorial-resource="guide-center"',
            'data-consult-tutorial-resource="quick-start-pdf"',
            'data-consult-tutorial-resource="detailed-manual-pdf"',
            '月額合計 5,500円（税込）',
            'https://lin.ee/YxJGXV6D',
            '../lp-sharoushi.html',
            '../flyer-sharoushi.html',
            '../flyer-sharoushi.pdf',
            '../systems-data.js',
            '../dpro-v3.js',
            ':focus-visible'
          ];
          for (const token of requiredSourceTokens) {
            assert(source.includes(token), `Preserved/source token missing: ${token}`);
          }
          assert((source.match(/data-consult-tutorial-resource=/g) || []).length === 4,
            'Tutorial resource marker count is not exactly 4');

          // ----- Wait for actual public Pages to expose this R6 -----
          let liveHtml = null;
          for (let i=0; i<36; i++) {
            const r = await getBuffer(`${env.PRODUCT_URL}?r6qa=${Date.now()}`);
            if (r.ok) {
              const text = r.body.toString('utf8');
              if (text.includes('data-consult-tutorial-resource="tutorial-start"') &&
                  text.includes('data-consult-tutorial-resource="detailed-manual-pdf"')) {
                liveHtml = r;
                break;
              }
            }
            await new Promise(res => setTimeout(res, 10000));
          }
          assert(liveHtml, 'Product Site Pages did not expose R6 markers within wait window');
          evidence.productSite.publicHttp = liveHtml.status;
          evidence.productSite.publicHtmlSha256 = sha256(liveHtml.body);

          // ----- All four exact public resources reachable -----
          const expectedLinks = {
            tutorialStart: env.TUTORIAL_URL,
            guideCenter: env.GUIDE_URL,
            quickStartPdf: env.QUICK_PDF_URL,
            detailedManualPdf: env.DETAIL_PDF_URL
          };
          for (const [name,url] of Object.entries(expectedLinks)) {
            const r = await getBuffer(url);
            assert(r.ok, `${name} public HTTP ${r.status}`);
            if (name.endsWith('Pdf')) {
              const ct = (r.headers['content-type'] || '').toLowerCase();
              assert(ct.includes('pdf') || r.body.subarray(0,5).toString() === '%PDF-',
                `${name} is not PDF content: ${ct}`);
            }
            evidence.links[name] = {
              url, status:r.status, finalUrl:r.finalUrl,
              contentType:r.headers['content-type'] || '',
              bytes:r.body.length, sha256:sha256(r.body)
            };
          }

          const tutorialJs = await getBuffer(env.TUTORIAL_JS_URL);
          assert(tutorialJs.ok, `Tutorial JS HTTP ${tutorialJs.status}`);
          const tutorialText = tutorialJs.body.toString('utf8');
          const ids = [...tutorialText.matchAll(/id\s*:\s*['"](CONSULT-T\d{2})['"]/g)].map(m=>m[1]);
          const uniqueIds = [...new Set(ids)];
          assert(uniqueIds.length === 10, `First10 source count expected 10, got ${uniqueIds.length}`);
          evidence.first10Count = 10;

          // ----- Exact Chromium QA -----
          const widths = [
            ['desktop1440',1440,1000],
            ['tablet1024',1024,768],
            ['mobile390',390,844],
            ['mobile320',320,720]
          ];
          const browser = await chromium.launch({headless:true});
          try {
            for (const [label,width,height] of widths) {
              const ctx = await browser.newContext({
                viewport:{width,height},
                screen:{width,height},
                deviceScaleFactor:1
              });
              const page = await ctx.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              const unsafeRequests = [];
              page.on('pageerror', e => pageErrors.push(String(e?.stack || e)));
              page.on('console', msg => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              page.on('request', req => {
                const method = req.method().toUpperCase();
                if (!['GET','HEAD','OPTIONS'].includes(method)) {
                  unsafeRequests.push({method,url:req.url()});
                }
              });

              const response = await page.goto(
                `${env.PRODUCT_URL}?r6qa=${Date.now()}-${label}`,
                {waitUntil:'networkidle', timeout:60000}
              );
              assert(response && response.status() < 400, `${label}: product HTTP ${response?.status()}`);

              const links = page.locator('a[data-consult-tutorial-resource]');
              assert(await links.count() === 4, `${label}: resource count != 4`);
              const found = {};
              for (let i=0;i<4;i++) {
                const a = links.nth(i);
                assert(await a.isVisible(), `${label}: resource ${i+1} not visible`);
                const key = await a.getAttribute('data-consult-tutorial-resource');
                const href = await a.getAttribute('href');
                found[key] = href;
              }
              assert(found['tutorial-start'] === env.TUTORIAL_URL, `${label}: Tutorial Start href mismatch`);
              assert(found['guide-center'] === env.GUIDE_URL, `${label}: Guide Center href mismatch`);
              assert(found['quick-start-pdf'] === env.QUICK_PDF_URL, `${label}: Quick PDF href mismatch`);
              assert(found['detailed-manual-pdf'] === env.DETAIL_PDF_URL, `${label}: Detailed PDF href mismatch`);

              // Keyboard-returned focus to the first resource link; then verify visible focus.
              const first = page.locator('a[data-consult-tutorial-resource="tutorial-start"]');
              await first.scrollIntoViewIfNeeded();
              await first.focus();
              await page.keyboard.press('Shift+Tab');
              await page.keyboard.press('Tab');
              const focus = await first.evaluate(el => {
                const s = getComputedStyle(el);
                return {
                  active: document.activeElement === el,
                  focusVisible: el.matches(':focus-visible'),
                  outlineStyle: s.outlineStyle,
                  outlineWidth: s.outlineWidth,
                  outlineColor: s.outlineColor
                };
              });
              assert(focus.active, `${label}: keyboard focus did not return to Tutorial Start`);
              assert(focus.focusVisible, `${label}: :focus-visible false`);
              assert(focus.outlineStyle !== 'none' && focus.outlineWidth !== '0px',
                `${label}: focus outline not visible`);

              const metrics = await page.evaluate(() => ({
                windowInnerWidth: window.innerWidth,
                documentElementScrollWidth: document.documentElement.scrollWidth,
                bodyScrollWidth: document.body.scrollWidth,
                title: document.title,
                systemCode: document.body.dataset.systemCode || ''
              }));
              assert(metrics.windowInnerWidth === width,
                `${label}: innerWidth ${metrics.windowInnerWidth} != ${width}`);
              const maxScroll = Math.max(metrics.documentElementScrollWidth, metrics.bodyScrollWidth);
              const positiveOverflow = Math.max(0, maxScroll - metrics.windowInnerWidth);
              assert(positiveOverflow === 0,
                `${label}: positive horizontal overflow ${positiveOverflow}`);
              assert(metrics.systemCode === 'CONSULT', `${label}: system code regression`);

              const bodyText = await page.locator('body').innerText();
              assert(bodyText.includes('月額合計 5,500円（税込）'), `${label}: price regression`);
              assert(await page.locator('a[href="https://lin.ee/YxJGXV6D"]').count() > 0, `${label}: LINE CTA regression`);
              assert(await page.locator('a[href="../lp-sharoushi.html"]').count() > 0, `${label}: LP regression`);
              assert(await page.locator('a[href="../flyer-sharoushi.html"]').count() > 0, `${label}: A4 HTML regression`);
              assert(await page.locator('a[href="../flyer-sharoushi.pdf"]').count() > 0, `${label}: A4 PDF regression`);

              assert(pageErrors.length === 0, `${label}: pageerror ${JSON.stringify(pageErrors)}`);
              assert(consoleErrors.length === 0, `${label}: console error ${JSON.stringify(consoleErrors)}`);
              assert(unsafeRequests.length === 0, `${label}: unsafe requests ${JSON.stringify(unsafeRequests)}`);

              await page.screenshot({path:`qa-evidence/product-${label}.png`,fullPage:true});
              evidence.browser[label] = {
                viewport:{width,height},
                ...metrics,
                positiveHorizontalOverflow:positiveOverflow,
                resourcesVisible:4,
                focus,
                pageErrors,
                consoleErrors,
                unsafeRequests,
                pass:true
              };
              evidence.unsafeWriteRequestCount += unsafeRequests.length;
              await ctx.close();
            }

            // R4 regression: Guide Center still exactly 10.
            const ctx = await browser.newContext({viewport:{width:1440,height:1000}});
            const guide = await ctx.newPage();
            const guideErrors = [];
            guide.on('pageerror', e => guideErrors.push(String(e?.stack || e)));
            const gr = await guide.goto(`${env.GUIDE_URL}?r6qa=${Date.now()}`, {waitUntil:'networkidle',timeout:60000});
            assert(gr && gr.status() < 400, `Guide Center HTTP ${gr?.status()}`);
            const guideCount = await guide.locator('.guide-card').count();
            assert(guideCount === 10, `Guide Center count expected 10, got ${guideCount}`);
            assert(guideErrors.length === 0, `Guide Center pageerror ${JSON.stringify(guideErrors)}`);
            evidence.guideCount = 10;

            // Tutorial Start must open the accepted engine without a business action.
            const tut = await ctx.newPage();
            const tutUnsafe = [];
            const tutErrors = [];
            tut.on('request', req => {
              const method=req.method().toUpperCase();
              if (!['GET','HEAD','OPTIONS'].includes(method)) tutUnsafe.push({method,url:req.url()});
            });
            tut.on('pageerror', e => tutErrors.push(String(e?.stack || e)));
            const tr = await tut.goto(env.TUTORIAL_URL, {waitUntil:'networkidle',timeout:60000});
            assert(tr && tr.status() < 400, `Tutorial Start HTTP ${tr?.status()}`);
            await tut.locator('#dpro-tutorial-v11-root').waitFor({state:'visible',timeout:15000});
            const engineExists = await tut.evaluate(() => !!window.DPRO_TUTORIAL_CONSULT_V11);
            assert(engineExists, 'Accepted Tutorial engine API missing');
            assert(tutUnsafe.length === 0, `Tutorial Start unsafe requests ${JSON.stringify(tutUnsafe)}`);
            assert(tutErrors.length === 0, `Tutorial Start pageerror ${JSON.stringify(tutErrors)}`);
            evidence.unsafeWriteRequestCount += tutUnsafe.length;
            await ctx.close();
          } finally {
            await browser.close();
          }

          assert(evidence.first10Count === 10, 'FIRST10_COUNT != 10');
          assert(evidence.guideCount === 10, 'GUIDE_COUNT != 10');
          assert(evidence.unsafeWriteRequestCount === 0, 'UNSAFE_WRITE_REQUEST != 0');
          assert(evidence.businessMutation === 0, 'BUSINESS_MUTATION != 0');
          assert(evidence.productSiteRegression === 0, 'PRODUCT_SITE_REGRESSION != 0');
          assert(evidence.productSiteRollback === 0, 'PRODUCT_SITE_ROLLBACK != 0');

          evidence.overallPass = true;
          fs.writeFileSync('qa-evidence/R6_LIVE_QA.json', JSON.stringify(evidence,null,2));
          fs.writeFileSync('qa-evidence/STATUS.txt', [
            'SYSTEM=CONSULT',
            'BATCH=10',
            'R6=PASS',
            'FIRST10_COUNT=10',
            'GUIDE_COUNT=10',
            'UNSAFE_WRITE_REQUEST=0',
            'BUSINESS_MUTATION=0',
            'PRODUCT_SITE_REGRESSION=0',
            'PRODUCT_SITE_ROLLBACK=0',
            'FORWARD_ONLY=PASS',
            'R7=NOT_AUTHORIZED_NOT_EXECUTED',
            'FINAL_LOCK=CENTRAL_DECISION_ONLY'
          ].join('\n')+'\n');
          console.log(JSON.stringify(evidence,null,2));
          JS

          node "$RUNNER_TEMP/consult-r6-qa/r6-live-qa.mjs"

      - name: Upload R6 QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consult-r6-live-qa
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CONSULT Tutorial R6 Public LIVE QA"
            if [ -f qa-evidence/STATUS.txt ]; then
              echo '```text'
              cat qa-evidence/STATUS.txt
              echo '```'
            else
              echo "R6=HOLD"
              echo "Evidence artifact/logs must be inspected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
