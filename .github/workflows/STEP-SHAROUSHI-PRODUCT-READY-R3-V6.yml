name: DPRO SHAROUSHI Product Ready R3 Static Safe Demo Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V6.yml'

permissions:
  contents: write

jobs:
  static-safe-demo-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify formal R2 source
        shell: bash
        run: |
          set -euo pipefail
          test -f product-ready/sharoushi-r2/EDGE_CONTROL_ADAPTER_R2.ts
          test -f product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          test -f product-ready/sharoushi-r2/DB_R2_SCHEMA.sql
          grep -F 'DPRO-CONTROL-ADAPTER-1.0-SHAROUSHI-20260823-R2V2' product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          echo "FORMAL_R2_SOURCE=PASS"

      - name: Build static Safe Demo from authoritative patched body
        shell: bash
        run: |
          set -euo pipefail

          SOURCE='https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-sharoushi-safe-demo'
          OUT='product-ready-demo'

          rm -rf "$OUT"
          mkdir -p "$OUT"

          files=(
            index.html
            member.html
            owner.html
            staff.html
            owner-ipad.html
            system-check.html
            demo-guide.html
            config.js
            runtime-contract.js
          )

          for f in "${files[@]}"; do
            echo "Fetch patched body: $f"
            curl --fail --silent --show-error --location \
              "${SOURCE}/${f}?static-v6=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -o "${OUT}/${f}"
            test -s "${OUT}/${f}"
          done

          cat > "${OUT}/SAFE_DEMO_VERSION.txt" <<EOF
          DPRO SHAROUSHI STATIC SAFE DEMO
          version=SHAROUSHI-PR3-STATIC-SAFE-DEMO-20260823
          source_commit=7c024207744f09b6f954a4d54f304dda4fecf2ce
          gateway=https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-sharoushi-control-gateway-v2
          generated_by=GitHub Actions
          EOF

          grep -F 'SHAROUSHI-PR2-FRONTEND-20260823' "${OUT}/config.js"
          grep -F 'dpro-sharoushi-control-gateway-v2' "${OUT}/config.js"
          grep -F 'STAFF_SESSION' "${OUT}/config.js"

          # Prevent accidental fallback to the legacy Worker as API authority.
          if grep -Fq 'const API_BASE_URL =' "${OUT}/config.js"; then
            python - <<'PY'
          from pathlib import Path
          t = Path("product-ready-demo/config.js").read_text(encoding="utf-8")
          marker = 'https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-sharoushi-control-gateway-v2'
          if marker not in t:
              raise SystemExit("SAFE_GATEWAY_NOT_BOUND")
          print("SAFE_GATEWAY_BOUND=PASS")
          PY
          fi

      - name: Commit static Safe Demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-demo

          if git diff --cached --quiet; then
            echo "Static Safe Demo already current."
          else
            git commit -m "Publish SHAROUSHI static safe demo V6"
          fi

          git pull --rebase
          git push

      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          set -euo pipefail

          BASE='https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo'
          EXPECT='SHAROUSHI-PR2-FRONTEND-20260823'
          ok=0

          for i in $(seq 1 36); do
            status="$(curl -sS -o /tmp/sharoushi-index.html -w '%{http_code}' "${BASE}/index.html?v6=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$status" = "200" ] && \
               curl -fsSL "${BASE}/config.js?v6=${GITHUB_RUN_ID}-${i}" | grep -Fq "$EXPECT"; then
              ok=1
              echo "GitHub Pages propagation PASS on attempt $i"
              break
            fi

            echo "Waiting for Pages: attempt=$i status=$status"
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "Static Safe Demo was committed but GitHub Pages propagation was not observed."
            exit 1
          fi

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharoushi-v6
          cd /tmp/sharoushi-v6
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run final Chromium matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/sharoushi-r3-final/screenshots

          cat > /tmp/sharoushi-v6/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE =
            'https://dpromstk2000-lab.github.io/dpro-consult-line/product-ready-demo/';

          const cases = [
            { key:'pc-owner',        file:'owner.html',        width:1440, height:1000 },
            { key:'mobile390',       file:'index.html',        width:390,  height:844  },
            { key:'mobile320-member',file:'member.html',       width:320,  height:720  },
            { key:'ipad-owner',      file:'owner-ipad.html',   width:1024, height:768  },
            { key:'pc-staff',        file:'staff.html',        width:1440, height:1000 },
            { key:'system-check',    file:'system-check.html', width:1440, height:1000 }
          ];

          const blockingConsolePattern =
            /(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;

          const technicalPattern =
            /(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser = await chromium.launch({ headless:true });
          const results = [];
          let failed = false;

          for (const c of cases) {
            const context = await browser.newContext({
              viewport: { width:c.width, height:c.height },
              deviceScaleFactor: 1
            });

            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const httpErrors = [];

            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('response', r => {
              if (r.status() >= 400) {
                httpErrors.push({
                  status:r.status(),
                  url:r.url(),
                  resourceType:r.request().resourceType()
                });
              }
            });

            let status = 0;
            let navigationError = '';

            try {
              const resp = await page.goto(
                BASE + c.file + '?qa=' + Date.now(),
                { waitUntil:'domcontentloaded', timeout:60000 }
              );
              status = resp?.status() || 0;
              await page.waitForTimeout(3000);
            } catch (e) {
              navigationError = String(e);
            }

            const metrics = navigationError ? null : await page.evaluate(() => {
              const de = document.documentElement;
              const b = document.body;
              return {
                innerWidth:window.innerWidth,
                documentScrollWidth:de?.scrollWidth || 0,
                bodyScrollWidth:b?.scrollWidth || 0,
                overflow:
                  Math.max(de?.scrollWidth || 0, b?.scrollWidth || 0) >
                  window.innerWidth + 1,
                text:(b?.innerText || '').slice(0,250000)
              };
            });

            const blockingConsoleErrors =
              consoleErrors.filter(x => blockingConsolePattern.test(x));

            const criticalResourceErrors = httpErrors.filter(x =>
              x.resourceType === 'document' ||
              x.resourceType === 'script' ||
              x.resourceType === 'stylesheet'
            );

            const technicalExposure =
              metrics ? technicalPattern.test(metrics.text) : true;

            const record = {
              ...c,
              url:BASE + c.file,
              httpStatus:status,
              navigationError,
              overflow:metrics?.overflow ?? true,
              innerWidth:metrics?.innerWidth ?? 0,
              documentScrollWidth:metrics?.documentScrollWidth ?? 0,
              bodyScrollWidth:metrics?.bodyScrollWidth ?? 0,
              pageErrors,
              consoleErrors,
              blockingConsoleErrors,
              httpErrors,
              criticalResourceErrors,
              technicalExposure
            };

            record.ok =
              !navigationError &&
              status === 200 &&
              !record.overflow &&
              pageErrors.length === 0 &&
              blockingConsoleErrors.length === 0 &&
              criticalResourceErrors.length === 0 &&
              !technicalExposure;

            if (!record.ok) failed = true;
            results.push(record);

            if (!navigationError) {
              await page.screenshot({
                path:`product-ready-evidence/sharoushi-r3-final/screenshots/${c.key}.png`,
                fullPage:true
              });
            }

            await context.close();
          }

          await browser.close();

          const summary = {
            ok:!failed,
            checkedAt:new Date().toISOString(),
            safeDemoBase:BASE,
            safeDemoVersion:'SHAROUSHI-PR3-STATIC-SAFE-DEMO-20260823',
            formalR2SourceCommit:'7c024207744f09b6f954a4d54f304dda4fecf2ce',
            total:results.length,
            passed:results.filter(x => x.ok).length,
            failed:results.filter(x => !x.ok).length,
            results
          };

          fs.writeFileSync(
            'product-ready-evidence/sharoushi-r3-final/browser-final.json',
            JSON.stringify(summary,null,2) + '\n'
          );

          console.log(JSON.stringify({
            ok:summary.ok,
            total:summary.total,
            passed:summary.passed,
            failed:summary.failed,
            failedCases:results.filter(x => !x.ok)
          }, null, 2));

          process.exit(summary.ok ? 0 : 2);
          EOF

          cd "$GITHUB_WORKSPACE"

          set +e
          node /tmp/sharoushi-v6/qa.mjs
          rc=$?
          set -e

          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Commit final browser evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git add product-ready-evidence/sharoushi-r3-final

          if git diff --cached --quiet; then
            echo "No final browser evidence changes."
          else
            git commit -m "Publish SHAROUSHI final static demo browser evidence"
          fi

          git pull --rebase
          git push

      - name: PASS cleanup
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"

          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V6.yml
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V5.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V4.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3.yml 2>/dev/null || true
          git rm -f ".github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3 (1).yml" 2>/dev/null || true

          git commit -m "Complete SHAROUSHI static Safe Demo browser gate"
          git push

      - name: FAIL preserve evidence
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "Final Chromium matrix has a blocking failure."
          echo "Evidence is committed at:"
          echo "product-ready-evidence/sharoushi-r3-final/browser-final.json"
          exit 1
