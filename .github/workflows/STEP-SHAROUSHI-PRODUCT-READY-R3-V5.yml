name: DPRO SHAROUSHI Product Ready R3 Browser Final

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V5.yml'

permissions:
  contents: write

jobs:
  browser-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify formal R2 source is already committed
        shell: bash
        run: |
          set -euo pipefail
          test -f product-ready/sharoushi-r2/EDGE_CONTROL_ADAPTER_R2.ts
          test -f product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          test -f product-ready/sharoushi-r2/EDGE_SAFE_DEMO_R2V3_EQUIVALENT.ts
          test -f product-ready/sharoushi-r2/DB_R2_SCHEMA.sql
          test -f product-ready/sharoushi-r2/RUNTIME_CONTRACT.js
          grep -F 'DPRO-CONTROL-ADAPTER-1.0-SHAROUSHI-20260823-R2V2' product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          grep -F 'SHAROUSHI-DB-PR2-20260823' product-ready/sharoushi-r2/DB_R2_SCHEMA.sql
          grep -F 'SHAROUSHI-PR2-FRONTEND-20260823' product-ready/sharoushi-r2/RUNTIME_CONTRACT.js
          echo "FORMAL_R2_SOURCE=PASS"
          git log --oneline -5

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharoushi-final
          cd /tmp/sharoushi-final
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run DPRO READY representative browser matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/sharoushi-r3/screenshots

          cat > /tmp/sharoushi-final/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-sharoushi-safe-demo-v4/';

          // DPRO READY representative matrix:
          // READY-018 PC, READY-019 390px, READY-020 320px,
          // READY-021 iPad plus staff and system-check verification.
          const cases = [
            { key:'pc-owner',       file:'owner.html',       width:1440, height:1000 },
            { key:'mobile390',      file:'index.html',       width:390,  height:844  },
            { key:'mobile320-member',file:'member.html',     width:320,  height:720  },
            { key:'ipad-owner',     file:'owner-ipad.html',  width:1024, height:768  },
            { key:'pc-staff',       file:'staff.html',       width:1440, height:1000 },
            { key:'system-check',   file:'system-check.html',width:1440, height:1000 }
          ];

          const blockingConsolePattern =
            /(ReferenceError|TypeError|SyntaxError|Uncaught|is not defined|Cannot read (properties|property)|Failed to execute)/i;

          const visibleTechnicalPattern =
            /(SUPABASE_SERVICE_ROLE_KEY|service[_ -]?role[_ -]?key|channel[_ -]?secret|stack trace|ReferenceError:|TypeError:|SyntaxError:)/i;

          const browser = await chromium.launch({ headless:true });
          const results = [];
          let failed = false;

          for (const c of cases) {
            const context = await browser.newContext({
              viewport: { width:c.width, height:c.height },
              deviceScaleFactor: 1
            });
            const page = await context.newPage();

            const pageErrors = [];
            const consoleErrors = [];
            const responses = [];

            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            page.on('response', r => {
              if (r.status() >= 400) {
                responses.push({
                  status: r.status(),
                  url: r.url(),
                  resourceType: r.request().resourceType()
                });
              }
            });

            let status = 0;
            let navigationError = '';

            try {
              const resp = await page.goto(BASE + c.file + '?qa=' + Date.now(), {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              status = resp?.status() || 0;
              await page.waitForTimeout(3000);
            } catch (e) {
              navigationError = String(e);
            }

            const metrics = navigationError ? null : await page.evaluate(() => {
              const de = document.documentElement;
              const b = document.body;
              return {
                innerWidth: window.innerWidth,
                documentScrollWidth: de?.scrollWidth || 0,
                bodyScrollWidth: b?.scrollWidth || 0,
                overflow:
                  Math.max(de?.scrollWidth || 0, b?.scrollWidth || 0) >
                  window.innerWidth + 1,
                title: document.title,
                visibleText: (b?.innerText || '').slice(0, 250000)
              };
            });

            const blockingConsoleErrors =
              consoleErrors.filter(x => blockingConsolePattern.test(x));

            const technicalExposure =
              metrics ? visibleTechnicalPattern.test(metrics.visibleText) : true;

            // Resource 401/403 from an intentional fail-close API call is recorded,
            // but is not itself a browser UI failure.
            // Missing document/script/stylesheet is blocking.
            const criticalResourceErrors = responses.filter(x =>
              x.resourceType === 'document' ||
              x.resourceType === 'script' ||
              x.resourceType === 'stylesheet'
            );

            const record = {
              ...c,
              url: BASE + c.file,
              httpStatus: status,
              navigationError,
              overflow: metrics?.overflow ?? true,
              innerWidth: metrics?.innerWidth ?? 0,
              documentScrollWidth: metrics?.documentScrollWidth ?? 0,
              bodyScrollWidth: metrics?.bodyScrollWidth ?? 0,
              pageErrors,
              consoleErrors,
              blockingConsoleErrors,
              httpErrors: responses,
              criticalResourceErrors,
              technicalExposure
            };

            const isFail =
              Boolean(navigationError) ||
              status !== 200 ||
              record.overflow ||
              pageErrors.length > 0 ||
              blockingConsoleErrors.length > 0 ||
              criticalResourceErrors.length > 0 ||
              technicalExposure;

            record.ok = !isFail;
            if (isFail) failed = true;
            results.push(record);

            if (!navigationError) {
              await page.screenshot({
                path: `product-ready-evidence/sharoushi-r3/screenshots/${c.key}.png`,
                fullPage: true
              });
            }

            await context.close();
          }

          await browser.close();

          const summary = {
            ok: !failed,
            checkedAt: new Date().toISOString(),
            formalSourceCommitExpected: '7c024207744f09b6f954a4d54f304dda4fecf2ce',
            safeDemoBase: BASE,
            policy: {
              pageErrorsMustBeZero: true,
              blockingConsoleMustBeZero: true,
              nonblockingConsoleIsRecorded: true,
              horizontalOverflowMustBeFalse: true,
              documentScriptStylesheetHttpErrorsMustBeZero: true,
              technicalExposureMustBeFalse: true
            },
            total: results.length,
            passed: results.filter(x => x.ok).length,
            failed: results.filter(x => !x.ok).length,
            results
          };

          fs.writeFileSync(
            'product-ready-evidence/sharoushi-r3/browser-final.json',
            JSON.stringify(summary, null, 2) + '\n'
          );

          console.log(JSON.stringify({
            ok: summary.ok,
            total: summary.total,
            passed: summary.passed,
            failed: summary.failed,
            failedCases: results.filter(x => !x.ok).map(x => ({
              key:x.key,
              httpStatus:x.httpStatus,
              overflow:x.overflow,
              pageErrors:x.pageErrors,
              blockingConsoleErrors:x.blockingConsoleErrors,
              criticalResourceErrors:x.criticalResourceErrors,
              technicalExposure:x.technicalExposure
            }))
          }, null, 2));

          process.exit(summary.ok ? 0 : 2);
          EOF

          cd "$GITHUB_WORKSPACE"
          set +e
          node /tmp/sharoushi-final/qa.mjs
          rc=$?
          set -e
          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharoushi-r3-browser-evidence-v12
          path: product-ready-evidence/sharoushi-r3
          if-no-files-found: error

      - name: Commit browser evidence for CENTRAL review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/sharoushi-r3

          if git diff --cached --quiet; then
            echo "No browser evidence changes."
          else
            git commit -m "Publish SHAROUSHI R3 browser evidence V5"
          fi

          git pull --rebase
          git push

      - name: PASS - self-delete workflow
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V5.yml
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3-V4.yml 2>/dev/null || true
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3.yml 2>/dev/null || true
          git rm -f ".github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3 (1).yml" 2>/dev/null || true
          git commit -m "Complete SHAROUSHI Product Ready R3 browser gate"
          git push

      - name: FAIL - preserve evidence for CENTRAL
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "Browser QA still has a blocking failure."
          echo "Evidence has been committed to:"
          echo "product-ready-evidence/sharoushi-r3/browser-final.json"
          echo "CENTRAL can inspect it without asking the user to download the artifact."
          exit 1
