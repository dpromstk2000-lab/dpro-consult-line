name: DPRO SHAROUSHI Product Ready R3 Source Browser

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3.yml'

permissions:
  contents: write

jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "CURRENT_HEAD=$(git rev-parse HEAD)"
          echo "R1_LOCKED_HEAD=ca5ef6b3f3d4dcd096a68e8e862d10afb6dadc3c"
          git log --oneline -5

      - name: Restore authoritative R2 source
        shell: python
        run: |
          import base64, pathlib
          payload = {
  "product-ready/sharoushi-r2/EDGE_CONTROL_ADAPTER_R2.ts": "",
  "product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts": "",
  "product-ready/sharoushi-r2/EDGE_SAFE_DEMO_R2V3_EQUIVALENT.ts": "",
  "product-ready/sharoushi-r2/DB_R2_SCHEMA.sql": "",
  "product-ready/sharoushi-r2/RUNTIME_CONTRACT.js": "Y29uc3QgU0hBUk9VU0hJX0ZST05URU5EX1ZFUlNJT04gPSAiU0hBUk9VU0hJLVBSMi1GUk9OVEVORC0yMDI2MDgyMyI7CndpbmRvdy5EUFJPX1NIQVJPVVNISV9GUk9OVEVORF9WRVJTSU9OID0gU0hBUk9VU0hJX0ZST05URU5EX1ZFUlNJT047Cg=="
}
          for path, b64 in payload.items():
              p = pathlib.Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
              print(path, p.stat().st_size)

      - name: Verify R2 source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          sha256sum product-ready/sharoushi-r2/*
          grep -F 'DPRO-CONTROL-ADAPTER-1.0-SHAROUSHI-20260823-R2V2' product-ready/sharoushi-r2/EDGE_CONTROL_GATEWAY_R2V2.ts
          grep -F 'SHAROUSHI-DB-PR2-20260823' product-ready/sharoushi-r2/DB_R2_SCHEMA.sql
          grep -F 'SHAROUSHI-PR2-FRONTEND-20260823' product-ready/sharoushi-r2/RUNTIME_CONTRACT.js

      - name: Commit formal R2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready/sharoushi-r2
          if git diff --cached --quiet; then
            echo "Source already committed."
          else
            git commit -m "Lock SHAROUSHI Product Ready R2 source"
            git push
          fi

      - name: Install Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sharoushi-qa
          cd /tmp/sharoushi-qa
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Create fresh Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-ready-evidence/sharoushi-r3/screenshots
          cat > /tmp/sharoushi-qa/qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const BASE = 'https://ropwvdnohadwxfbkcopx.supabase.co/functions/v1/dpro-sharoushi-safe-demo/';
          const pages = [
            'index.html',
            'member.html',
            'owner.html',
            'staff.html',
            'owner-ipad.html',
            'system-check.html'
          ];
          const viewports = [
            {name:'pc1440', width:1440, height:1000},
            {name:'mobile390', width:390, height:844},
            {name:'mobile320', width:320, height:700},
            {name:'ipad1024', width:1024, height:1366}
          ];
          const forbidden = [
            /SUPABASE_SERVICE_ROLE_KEY/i,
            /service[_ -]?role[_ -]?key/i,
            /channel[_ -]?secret/i,
            /access[_ -]?token\s*[:=]\s*['"][A-Za-z0-9._-]{12,}/i,
            /stack trace/i,
            /ReferenceError:/i,
            /TypeError:/i
          ];
          const browser = await chromium.launch({headless:true});
          const results = [];
          let failed = false;

          for (const vp of viewports) {
            const context = await browser.newContext({
              viewport: {width:vp.width,height:vp.height},
              deviceScaleFactor: 1
            });
            for (const file of pages) {
              const page = await context.newPage();
              const pageErrors = [];
              const consoleErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('console', msg => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              let status = 0;
              let navError = '';
              try {
                const resp = await page.goto(BASE + file + '?qa=' + Date.now(), {
                  waitUntil:'domcontentloaded',
                  timeout:60000
                });
                status = resp?.status() || 0;
                await page.waitForTimeout(2200);
              } catch (e) {
                navError = String(e);
              }

              const metrics = navError ? null : await page.evaluate(() => {
                const de = document.documentElement;
                const b = document.body;
                const text = (b?.innerText || '').slice(0, 250000);
                return {
                  innerWidth: window.innerWidth,
                  documentScrollWidth: de?.scrollWidth || 0,
                  bodyScrollWidth: b?.scrollWidth || 0,
                  overflow: Math.max(de?.scrollWidth || 0, b?.scrollWidth || 0) > window.innerWidth + 1,
                  title: document.title,
                  text
                };
              });

              const technicalExposure = metrics
                ? forbidden.some(re => re.test(metrics.text))
                : true;

              const record = {
                viewport: vp.name,
                width: vp.width,
                height: vp.height,
                file,
                url: BASE + file,
                status,
                navigationError: navError,
                overflow: metrics?.overflow ?? true,
                innerWidth: metrics?.innerWidth ?? 0,
                documentScrollWidth: metrics?.documentScrollWidth ?? 0,
                bodyScrollWidth: metrics?.bodyScrollWidth ?? 0,
                pageErrors,
                consoleErrors,
                technicalExposure
              };

              const isFail =
                navError ||
                status !== 200 ||
                record.overflow ||
                pageErrors.length > 0 ||
                consoleErrors.length > 0 ||
                technicalExposure;

              record.pass = !isFail;
              if (isFail) failed = true;
              results.push(record);

              const shot = `product-ready-evidence/sharoushi-r3/screenshots/${vp.name}-${file.replace('.html','')}.png`;
              if (!navError) await page.screenshot({path:shot, fullPage:true});
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          const summary = {
            ok: !failed,
            generatedAt: new Date().toISOString(),
            safeDemoBase: BASE,
            total: results.length,
            passed: results.filter(x => x.pass).length,
            failed: results.filter(x => !x.pass).length,
            results
          };
          fs.writeFileSync(
            'product-ready-evidence/sharoushi-r3/browser-final.json',
            JSON.stringify(summary, null, 2) + '\n'
          );
          console.log(JSON.stringify({ok:summary.ok,total:summary.total,passed:summary.passed,failed:summary.failed}, null, 2));
          process.exit(summary.ok ? 0 : 2);
          EOF
          cd "$GITHUB_WORKSPACE"
          set +e
          node /tmp/sharoushi-qa/qa.mjs
          rc=$?
          set -e
          echo "QA_EXIT=$rc" >> "$GITHUB_ENV"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharoushi-r3-browser-evidence
          path: product-ready-evidence/sharoushi-r3
          if-no-files-found: warn

      - name: Commit PASS evidence and self-delete
        if: env.QA_EXIT == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpro-product-ready-bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-ready-evidence/sharoushi-r3
          git rm -f .github/workflows/STEP-SHAROUSHI-PRODUCT-READY-R3.yml
          git commit -m "Verify SHAROUSHI Product Ready R3 browser QA"
          git push

      - name: Fail when browser QA failed
        if: env.QA_EXIT != '0'
        shell: bash
        run: |
          echo "Fresh Chromium QA failed. Check sharoushi-r3-browser-evidence artifact."
          exit 1
